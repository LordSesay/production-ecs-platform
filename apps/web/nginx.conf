server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"healthy","service":"ecs-release-web"}';
  }

  # Docker Compose fallback. Production /api traffic is routed by the ALB.
  # Using a variable defers Docker-only DNS resolution until request time.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $compose_api_host api;

    proxy_pass http://$compose_api_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
