version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    rebase-strategy: auto
    commit-message:
      prefix: deps(npm)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    groups:
      actions-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: deps(actions)

  - package-ecosystem: terraform
    directories:
      - /infrastructure/bootstrap-state
      - /infrastructure/foundation
      - /infrastructure/jenkins
      - /infrastructure/workload
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    groups:
      terraform-providers:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: deps(terraform)

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    groups:
      container-images:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: deps(docker)
