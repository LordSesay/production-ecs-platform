name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Validate applications
        run: npm run validate

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.9"

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Initialize and validate stacks
        run: |
          set -Eeuo pipefail
          for stack in bootstrap-state foundation jenkins workload; do
            echo "Validating infrastructure/${stack}"
            terraform -chdir="infrastructure/${stack}" init \
              -backend=false \
              -input=false
            terraform -chdir="infrastructure/${stack}" validate
          done

  shell:
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Bash syntax
        run: |
          set -Eeuo pipefail
          for script in scripts/*.sh; do
            bash -n "${script}"
          done

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Verify runtime contracts
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/api/platform
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T web id -u)" = "101"

      - name: Show service diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - application
      - terraform
      - shell
      - containers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          set -Eeuo pipefail
          test "${APPLICATION_RESULT}" = "success"
          test "${TERRAFORM_RESULT}" = "success"
          test "${SHELL_RESULT}" = "success"
          test "${CONTAINERS_RESULT}" = "success"
