services:
  api:
    build:
      context: ./apps/api
    # Mirror the ECS task definition: read-only root filesystem, writable /tmp.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_ENVIRONMENT: local
      APP_VERSION: compose
      COMMIT_SHA: local
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    build:
      context: ./apps/web
    # Read-only root like ECS. No tmpfs here: an empty tmpfs would hide the
    # nginx temp directories the image prepares for uid 101. The image's
    # VOLUME ["/tmp"] is seeded from those directories, as the ECS volume is.
    read_only: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 3
